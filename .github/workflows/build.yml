# Unsigned Tauri bundles for Linux, Windows, and macOS.
#
# This file is ready for a CI host that actually provides those runners
# (GitHub Actions, or Buildkite with Windows and macOS queues mapped).
# Origin does not run it. Depot CI, if connected later, rewrites
# windows-latest and macos-latest to a Linux sandbox, so it must not be
# the host for this matrix.
#
# No signing secrets are set. macOS bundles are ad-hoc signed via
# bundle.macOS.signingIdentity in src-tauri/tauri.conf.json.
# The job uploads the installers as CI artifacts. It does not create a
# GitHub Release, because this repository is not on GitHub.

name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: test and bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            args: ""
          - os: windows-latest
            label: windows-x64
            args: ""
          - os: macos-latest
            label: macos-aarch64
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            label: macos-x64
            args: "--target x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install npm dependencies
        run: npm ci

      - name: test
        run: npm test

      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: mindmap3d-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
