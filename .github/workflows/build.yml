# Unsigned Tauri bundles for Linux, Windows, and macOS.
#
# Runs on GitHub Actions for this repository
# (https://github.com/Jenrymung/noosphere3d). Origin does not run it.
# Depot CI, if connected later, rewrites windows-latest and macOS labels
# to a Linux sandbox, so it must not be the host for this matrix.
# Apple Silicon uses macos-15. Intel uses macos-15-intel so the x64
# job does not wait on the arm64 runner pool.
#
# No signing secrets are set. macOS bundles stay ad-hoc signed via
# bundle.macOS.signingIdentity "-" in src-tauri/tauri.conf.json.
# There is no Apple signing identity.
#
# The build job uploads installers as workflow artifacts named
# noosphere3d-linux-x64, noosphere3d-windows-x64,
# noosphere3d-macos-aarch64, and noosphere3d-macos-x64.
# THIRD-PARTY-NOTICES.md is generated before tests and again before
# each bundle (npm run build), then embedded in the app. A separate
# job uploads the same file as noosphere3d-third-party-notices.
# Generation fails only when a tool errors, not because of a licence
# string it found. A local dev build writes a short placeholder when
# the tools are missing.
#
# Pushes to main and workflow_dispatch do not create a GitHub Release.
# A push of a v* tag creates a draft pre-release, tauri-action attaches
# the installers, and a final job adds THIRD-PARTY-NOTICES.md and
# publishes that pre-release. macOS stays ad-hoc signed. Windows stays
# unsigned. No updater artifacts are uploaded.

name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: open a draft pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Noosphere 3D ${tag}" \
              --notes "Attaching unsigned installers. This draft is published when every asset is uploaded." \
              --draft \
              --prerelease
          fi

  build:
    name: test and bundle (${{ matrix.label }})
    needs: prepare-release
    permissions:
      contents: write
      actions: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            args: ""
            targets: ""
          - os: windows-latest
            label: windows-x64
            args: ""
            targets: ""
          - os: macos-15
            label: macos-aarch64
            args: "--target aarch64-apple-darwin"
            targets: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x64
            args: "--target x86_64-apple-darwin"
            targets: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm file libfuse2

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install npm dependencies
        run: npm ci

      - name: install cargo-license
        run: cargo install cargo-license --version 0.7.0 --locked

      - name: generate third-party notices
        run: npm run notices

      - name: test
        run: npm test

      - name: bundle without a release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

      - name: bundle and attach installers to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Noosphere 3D ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

      - name: upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: noosphere3d-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app

  notices:
    name: third-party notices
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: install npm dependencies
        run: npm ci

      - name: install cargo-license
        run: cargo install cargo-license --version 0.7.0 --locked

      - name: generate third-party notices
        run: npm run notices

      - name: upload third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: noosphere3d-third-party-notices
          if-no-files-found: error
          path: THIRD-PARTY-NOTICES.md

  publish:
    name: publish pre-release
    needs: [build, notices]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: download third-party notices
        uses: actions/download-artifact@v4
        with:
          name: noosphere3d-third-party-notices
          path: notices

      - name: attach notices and publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          notes_file="$(find notices -name THIRD-PARTY-NOTICES.md -print -quit)"
          test -n "$notes_file"
          gh release upload "$tag" "$notes_file" --repo "$GITHUB_REPOSITORY" --clobber
          python3 - <<'PY'
          import json, os, subprocess, sys
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          with open("src-tauri/tauri.conf.json", encoding="utf-8") as fh:
              conf = json.load(fh)
          # tauri-action replaces spaces in the product name with dots in release asset names.
          product = conf["productName"].replace(" ", ".")
          version = conf["version"]
          expected = {
              f"{product}_{version}_amd64.AppImage",
              f"{product}_{version}_amd64.deb",
              f"{product}-{version}-1.x86_64.rpm",
              f"{product}_{version}_x64-setup.exe",
              f"{product}_{version}_x64_en-US.msi",
              f"{product}_{version}_aarch64.dmg",
              f"{product}_{version}_x64.dmg",
              "THIRD-PARTY-NOTICES.md",
          }
          raw = subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "assets,isDraft,isPrerelease"],
              text=True,
          )
          release = json.loads(raw)
          names = {item["name"] for item in release["assets"]}
          print("assets:", ", ".join(sorted(names)))
          missing = sorted(expected - names)
          if missing:
              sys.exit("missing release assets: " + ", ".join(missing))
          PY
          notes="docs/release-notes/${tag}.md"
          test -f "$notes"
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$notes" \
            --prerelease \
            --draft=false
