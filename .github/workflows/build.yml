# Unsigned Tauri bundles for Linux, Windows, and macOS.
#
# Runs on GitHub Actions for this repository
# (https://github.com/Jenrymung/noosphere3d). Origin does not run it.
# Depot CI, if connected later, rewrites windows-latest and macOS labels
# to a Linux sandbox, so it must not be the host for this matrix.
# Apple Silicon uses macos-15. Intel uses macos-15-intel so the x64
# job does not wait on the arm64 runner pool.
#
# No signing secrets are set. macOS bundles stay ad-hoc signed via
# bundle.macOS.signingIdentity "-" in src-tauri/tauri.conf.json.
# There is no Apple signing identity.
#
# The job uploads installers as workflow artifacts named
# noosphere3d-linux-x64, noosphere3d-windows-x64,
# noosphere3d-macos-aarch64, and noosphere3d-macos-x64.
# tagName and releaseId are omitted, so tauri-action does not create
# or publish a GitHub Release.

name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: test and bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            args: ""
            targets: ""
          - os: windows-latest
            label: windows-x64
            args: ""
            targets: ""
          - os: macos-15
            label: macos-aarch64
            args: "--target aarch64-apple-darwin"
            targets: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x64
            args: "--target x86_64-apple-darwin"
            targets: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm file libfuse2

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install npm dependencies
        run: npm ci

      - name: test
        run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: ${{ matrix.args }}

      - name: upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: noosphere3d-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
